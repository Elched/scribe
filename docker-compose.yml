# ── SCRIBE — docker-compose.yml (version open-source) ─────────────────────
# Usage :
#   docker compose up -d          → first start
#   docker compose down           → stop all services
#   docker compose logs -f        → view logs in real-time
#   docker compose pull && docker compose up -d  → update
#
# For LAN access:
#   1. Set SCRIBE_HOST in .env to your server's IP or hostname
#   2. Update CORS_ORIGINS if needed
#   3. Run: docker compose up -d
# test

services:
  traefik:
    image: traefik:latest
    container_name: scribe-traefik
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"    # Listen on all interfaces (HTTP)
      - "0.0.0.0:443:443"  # Listen on all interfaces (HTTPS)
      - "0.0.0.0:8080:8080" # Dashboard (development only — restrict in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/data/certs:ro
      - traefik_data:/data
    networks:
      - scribe_default
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    command:
      - "traefik"
      - "--configFile=/etc/traefik/traefik.yml"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  scribe:
    image: elched/hospsec:v1.3.2
    #build:
    #  context: ./scribe
    #  dockerfile: Dockerfile
    container_name: scribe
    restart: on-failure:3
    expose:
      - "8000"
    volumes:
      - scribe_data:/data
    environment:
      - SCRIBE_IA_PROVIDER=${SCRIBE_IA_PROVIDER:-albert}
      - SCRIBE_IA_KEY=${SCRIBE_IA_KEY:-}
      - SCRIBE_IA_MODEL=${SCRIBE_IA_MODEL:-}
      - SCRIBE_IA_URL=${SCRIBE_IA_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_SECRET=${SCRIBE_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Scribe2026!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost,http://localhost:8000,https://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scribe_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scribe.rule=PathPrefix(`/`)"
      - "traefik.http.routers.scribe.priority=1"
      - "traefik.http.routers.scribe.entrypoints=web,websecure"
      - "traefik.http.routers.scribe.service=scribe"
      - "traefik.http.services.scribe.loadbalancer.server.port=8000"
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  scribe_data:
    driver: local
  traefik_data:
    driver: local

networks:
  scribe_default:
    driver: bridge
    name: scribe_default
