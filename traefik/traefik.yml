api:
  dashboard: true
  insecure: true  # Only for development - remove in production

entryPoints:
  web:
    address: "0.0.0.0:80"  # Listen on all interfaces
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: "0.0.0.0:443"  # Listen on all interfaces
    http:
      tls:
        certResolver: myresolver

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: scribe_default
  file:
    filename: /etc/traefik/dynamic.yml

certificatesResolvers:
  myresolver:
    acme:
      email: "admin@example.com"   # change to your real email in production
      storage: "/data/acme.json"
      tlsChallenge: {}

log:
  level: INFO

accessLog: {}