api:
  dashboard: true
  insecure: true  # Only for development - remove in production

entryPoints:
  web:
    address: "0.0.0.0:80"  # Listen on all interfaces

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: scribe_default

log:
  level: INFO

accessLog: {}